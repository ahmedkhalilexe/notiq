name: CI

on:
  pull_request:
    branches: ["DEV", "main"]
  push:
    branches: ["DEV", "main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.12

jobs:
  biome_version_check:
    name: Biome version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check biome version across the services
        run: ./scripts/biome-verion-check.sh

  typecheck_api:
    name: API / typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notiq-api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  lint_api:
    name: API / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notiq-api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  format_api:
    name: API / format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notiq-api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format

  ci_api:
    name: API / biome ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notiq-api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome ci
        run: bun run ci

  test_api:
    name: API / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notiq-api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test

  # Only builds the Docker image if every API check passed.
  build_api:
    name: API / docker build
    runs-on: ubuntu-latest
    needs: [typecheck_api, lint_api, format_api, ci_api, test_api]
    defaults:
      run:
        working-directory: services/notiq-api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build image
        run: bun run build

